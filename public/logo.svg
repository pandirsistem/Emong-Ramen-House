  <!-- Ramen bowl -->
  <path d="M110 88 C115 110, 165 110, 170 88 Z" fill="#111827"/>
  <rect x="130" y="108" width="20" height="4" rx="2" fill="#111827"/>
  <!-- Bottom text -->
