  <path d="M125 58 Q125 45 130 45 Q135 45 135 58" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <path d="M132 58 Q132 42 138 42 Q144 42 144 58" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
