  <rect x="95" y="45" width="90" height="70" fill="none" stroke="#111827" stroke-width="4"/>
  <!-- Red seal circle -->
  <circle cx="55" cy="80" r="28" fill="#e11d48"/>
  <text x="55" y="86" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="14">Buhun</text>
  <!-- Ramen bowl & noodles -->
  <!-- Chopsticks -->
  <line x1="110" y1="52" x2="180" y2="52" stroke="#111827" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="110" y1="58" x2="180" y2="58" stroke="#111827" stroke-width="3.5" stroke-linecap="round"/>
